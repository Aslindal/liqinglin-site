backend:
  name: github
  repo: Aslindal/liqinglin-site
  branch: main
  app_id: Ov23liEn0OR3lNUXUMY0

locale: "zh_Hans"
media_folder: "media"
public_folder: "/media"
publish_mode: simple

collections:
  - name: "essays"
    label: "文章"
    folder: "writing"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{fields.slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "文件名（英文，如 law-and-chance，只能字母数字连字符）", name: "slug", widget: "string" }
      - { label: "日期", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "摘要（首页卡片显示的一句话，30字内）", name: "excerpt", widget: "string" }
      - { label: "正文", name: "body", widget: "markdown" }
